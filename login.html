<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIDCUF</title>

```
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
```

</head>
<body>

```
<main>

    <div class="container">

        <div id="tituloLogin">
            <h2>Iniciar Sesión</h2>
            <p>Accede a tu cuenta de SIDCUF para continuar tu proceso de orientación vocacional y educación financiera.</p>
        </div>

        <div id="formularioLogin">

            <label for="usuarioLogin">Correo electrónico o usuario</label>
            <input
                id="usuarioLogin"
                type="text"
                placeholder="Ingresa tu correo o usuario"
            >

            <br>

            <label for="contraseñaLogin">Contraseña</label>
            <input
                type="password"
                name="contraseñaLogin"
                id="contraseñaLogin"
                placeholder="Ingresa tu contraseña"
            >

            <br>

            <button id="botonLogin">Ingresar</button>

            <p>
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>

        </div>

    </div>

</main>

<script src="js/login.js"></script>
```

</body>
</html>
