<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SIDCUF</title>

```
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/registro.css">
```

</head>
<body>

```
<main>

    <div class="container">

        <div id="tituloRegistro">
            <h2>Crear cuenta</h2>
            <p>Únete a SIDCUF y comienza a construir tu proyecto de vida con orientación vocacional y educación financiera.</p>
        </div>

        <div id="formularioRegistro">

            <label for="usuario">Correo electrónico o usuario</label>
            <input
                id="usuario"
                type="text"
                placeholder="Ingresa tu correo o usuario"
            >

            <br>

            <label for="contraseña">Contraseña</label>
            <input
                type="password"
                name="contraseña"
                id="contraseña"
                placeholder="Crea una contraseña segura"
            >

            <br>

            <button id="botonRegistro">Crear cuenta</button>

            <p>
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión aquí</a>
            </p>

        </div>

    </div>

</main>

<script src="js/registro.js"></script>
```

</body>
</html>
